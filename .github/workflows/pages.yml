name: Deploy Karnataka Physical AI site

on:
  push:
    branches: [main, claude/karnataka-ai-website-redesign-ni4vz0]
    paths: ['karnataka-physical-ai/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: karnataka-physical-ai
      - id: deployment
        uses: actions/deploy-pages@v4
